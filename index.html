<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2d4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Hisab</title>
<style>
:root{
  --bg:#f3f5f9;--card:#fff;--ink:#17233b;--mute:#6b7a90;--line:#e3e8f0;--navy:#1f2d4a;--accent:#2f4b7c;
  --red:#c0392b;--redbg:#fbe4e1;--green:#1e8449;--greenbg:#e3f4ea;--zeb:#eef2f7;--shadow:0 2px 10px rgba(23,35,59,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0f1624;--card:#18223a;--ink:#e8edf6;--mute:#93a1b8;--line:#2a3652;--navy:#0b1220;--accent:#7aa2e3;
  --red:#ff8c7f;--redbg:#3a1f22;--green:#6fd39a;--greenbg:#173326;--zeb:#1d2943;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:96px;font-size:15px}
.wrap{max-width:600px;margin:0 auto;padding:0 14px}
header{background:var(--navy);color:#fff;padding:14px 0 70px;padding-top:max(14px,env(safe-area-inset-top))}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{font-size:18px;margin:0}
.top small{display:block;opacity:.7;font-size:11px;margin-top:2px}
.chips{display:flex;gap:6px}
.chip{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:99px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer}
.hero{margin:-52px 0 14px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:18px;border:1px solid var(--line)}
.hero .lbl{font-size:11px;letter-spacing:.08em;color:var(--mute);font-weight:700}
.hero .big{font-size:26px;font-weight:800;margin:6px 0 2px;line-height:1.2}
.hero .sub{font-size:13px;color:var(--mute)}
.hero.red{border-left:6px solid var(--red)}.hero.red .big{color:var(--red)}
.hero.green{border-left:6px solid var(--green)}.hero.green .big{color:var(--green)}
.hero.zero .big{color:var(--green)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kpi b{display:block;font-size:15px;margin-top:3px}.kpi span{font-size:10px;color:var(--mute);font-weight:700;letter-spacing:.05em}
h2{font-size:14px;margin:18px 2px 8px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.entry{display:flex;gap:10px;padding:12px;border-bottom:1px solid var(--line);cursor:pointer}
.entry:last-child{border:0}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
.entry .mid{flex:1;min-width:0}
.entry .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .s{font-size:12px;color:var(--mute);margin-top:2px}
.entry .r{text-align:right;flex:none}
.entry .amt{font-weight:750}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;margin-top:4px}
.pill.red{background:var(--redbg);color:var(--red)}.pill.green{background:var(--greenbg);color:var(--green)}.pill.zero{background:var(--zeb);color:var(--mute)}
.empty{padding:30px 16px;text-align:center;color:var(--mute)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:center}
nav button.tab{background:none;border:0;padding:10px 0 9px;font-size:11px;color:var(--mute);font-weight:650;cursor:pointer}
nav button.tab span{display:block;font-size:20px;line-height:1.1}
nav button.tab.on{color:var(--accent)}
.fab{width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:30px;line-height:1;margin:-26px auto 0;box-shadow:0 6px 16px rgba(47,75,124,.45);cursor:pointer}
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,30,.55);z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:17px}
label.f{display:block;font-size:11px;font-weight:700;color:var(--mute);letter-spacing:.05em;margin:12px 0 5px;text-transform:uppercase}
input[type=text],input[type=number],input[type=date],select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:var(--bg);color:var(--ink)}
.amount{font-size:28px!important;font-weight:800}
.seg{display:flex;background:var(--zeb);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:10px 4px;border-radius:10px;font-weight:650;color:var(--mute);font-size:13px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:7px 11px;font-size:13px;cursor:pointer}
.cats button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.preview{margin-top:14px;padding:12px;border-radius:12px;font-size:14px;line-height:1.45}
.preview.red{background:var(--redbg);color:var(--red)}.preview.green{background:var(--greenbg);color:var(--green)}.preview.zero{background:var(--zeb);color:var(--ink)}
.row{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:var(--zeb);color:var(--ink)}.btn.danger{background:var(--redbg);color:var(--red);flex:0 0 auto;padding:14px 18px}
.donutwrap{display:flex;gap:14px;align-items:center;padding:14px;flex-wrap:wrap}
.legend{flex:1;min-width:150px;font-size:13px}.legend div{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.bar{padding:6px 14px}.bar .nm{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar .tr{height:16px;background:var(--zeb);border-radius:99px;overflow:hidden}.bar .fl{height:100%;border-radius:99px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px;font-size:11px;letter-spacing:.04em}
td{padding:8px 10px;border-bottom:1px solid var(--line)}tr:nth-child(even) td{background:var(--zeb)}
td.n,th.n{text-align:right}
.log{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px}.log:last-child{border:0}
.log b{font-weight:700}.log small{display:block;color:var(--mute);margin-top:2px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;z-index:60;display:none;box-shadow:0 6px 18px rgba(0,0,0,.3);max-width:90%}
.welcome{max-width:420px;margin:12vh auto;padding:0 18px;text-align:center}
.welcome h1{font-size:26px}.welcome p{color:var(--mute);line-height:1.5}
.banner{background:#fff3cd;color:#664d03;padding:8px 12px;font-size:12px;text-align:center}
.cats button.me{outline:2px solid var(--accent)}
.nets{display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-end;margin-top:4px}
.pill.sm{font-size:10px;padding:2px 6px;margin:0}
.line{padding:4px 0;font-size:18px;font-weight:800}
.shr{display:flex;align-items:center;gap:8px;margin-top:6px}.shr span{flex:1}.shr input{width:110px!important;padding:9px!important}
.view{display:none}.view.on{display:block}
#printArea{display:none}
@media print{
  body{background:#fff;color:#000;padding:0}
  header,nav,.wrap#app,.sheet-bg,.toast,.banner{display:none!important}
  #printArea{display:block;padding:10mm;font-size:11px;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea h1{font-size:20px;margin:0;color:#1f2d4a}#printArea h4{margin:14px 0 6px;color:#1f2d4a}
  #printArea table th{background:#1f2d4a!important;color:#fff!important}
  #printArea .box{background:#e3f4ea;border:1px solid #8fd0a8;padding:10px;text-align:center;font-size:16px;font-weight:700;color:#1e8449;margin-top:10px}
  #printArea .r{background:#fbe4e1;color:#c0392b;font-weight:700}#printArea .g{background:#e3f4ea;color:#1e8449;font-weight:700}
}
</style>
</head>
<body>
<div id="banner"></div>
<div id="welcome" class="welcome" style="display:none">
  <div style="font-size:54px">📒</div>
  <h1>Hisab · Shared expenses</h1>
  <p>No login needed. Your hisab lives behind a private link. Create it once, then share the link only with each other.</p>
  <div id="saved"></div>
  <div class="row" style="flex-direction:column">
    <button class="btn" id="createBtn">Create new hisab</button>
    <input type="text" id="pasteLink" placeholder="…or paste your hisab link here" style="margin-top:6px">
    <button class="btn ghost" id="openBtn">Open this link</button>
  </div>
</div>

<div id="setup" class="welcome" style="display:none;text-align:left">
  <h1 style="text-align:center">Set up your group</h1>
  <label class="f">Group name</label><input type="text" id="su-name" value="Our Hisab">
  <label class="f">How many people?</label><select id="su-n"></select>
  <div id="su-names"></div>
  <div class="row"><button class="btn" id="su-go">Start hisab</button></div>
</div>
<div id="main" style="display:none">
<header><div class="wrap top">
  <div><h1>📒 Hisab</h1><small id="since">Devesh &amp; Vishal</small></div>
  <div class="chips"><button class="chip" id="meChip"></button><button class="chip" id="cfgBtn">⚙</button><button class="chip" id="shareBtn">🔗 Share</button><button class="chip" id="pdfBtn">⬇ PDF</button></div>
</div></header>

<div class="wrap" id="app">
  <div class="hero" id="hero"></div>
  <div class="view on" id="v-home">
    <div class="kpis" id="kpis"></div>
    <h2>Ledger</h2>
    <div class="card" id="ledger"></div>
  </div>
  <div class="view" id="v-dash"></div>
  <div class="view" id="v-logs"></div>
</div>

<nav><div class="in">
  <button class="tab on" data-v="home"><span>🧾</span>Ledger</button>
  <button class="tab" data-v="dash"><span>📊</span>Dashboard</button>
  <div><button class="fab" id="fab">+</button></div>
  <button class="tab" data-v="logs"><span>🕘</span>Logs</button>
  <button class="tab" id="settleTab"><span>✅</span>Settle</button>
</div></nav>
</div>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="sheet-bg" id="meBg"><div class="sheet" style="text-align:center">
  <h3>Who are you?</h3><p style="color:var(--mute);margin-top:0">Entries and logs are tagged with your name.</p>
  <div class="row" id="meList" style="flex-wrap:wrap"></div>
</div></div>
<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";
const CATS={Food:["🍽️","#59a14f"],Drinks:["🥤","#2f4b7c"],Fuel:["⛽","#f28e2b"],Outing:["🏞️","#76b7b2"],Rent:["🏠","#b07aa1"],Utilities:["💡","#edc948"],Shopping:["🛍️","#ff9da7"],Travel:["🚗","#9c755f"],Other:["📦","#e15759"],Loan:["🤝","#8e9bb0"]};
const PAL=["#2f4b7c","#f28e2b","#59a14f","#e15759","#76b7b2","#b07aa1","#edc948","#ff9da7","#9c755f","#8e9bb0"];
const START="2026-11-23";
const DEFAULT_MEMBERS=[{id:"D",name:"Devesh"},{id:"V",name:"Vishal"}];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round(n*100)/100;
const inr=n=>"₹"+r2(n).toLocaleString("en-IN",{maximumFractionDigits:2});
const fdate=d=>{const [y,m,dd]=d.split("-");return `${+dd} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m-1]}`};
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",2600)};
const lget=k=>{try{return localStorage.getItem(k)||""}catch{return""}};
const lset=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};

/* ---------- secret key (lives in the URL #, never in the repo) ---------- */
const getKey=()=>{const m=location.hash.match(/k=([A-Za-z0-9_-]{24,})/);return m?m[1]:lget("hisab_key")};
const newKey=()=>{const a=new Uint8Array(24);crypto.getRandomValues(a);return Array.from(a,b=>"abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789"[b%57]).join("")};
const setKey=k=>{lset("hisab_key",k);location.hash="k="+k};
let KEY=getKey();
if(KEY&&!location.hash.includes(KEY))setKey(KEY);

/* ---------- storage: Firebase if configured, otherwise local demo ---------- */
const live=!!(firebaseConfig&&firebaseConfig.apiKey&&firebaseConfig.projectId);
let store;
const showErr=e=>{console.error(e);toast("Connection problem: "+(e.code||e.message))};
async function initStore(){
  if(live){
    const {initializeApp}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const fs=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const db=fs.getFirestore(initializeApp(firebaseConfig));
    const E=fs.collection(db,"hisabs",KEY,"entries"),L=fs.collection(db,"hisabs",KEY,"logs"),M=fs.doc(db,"hisabs",KEY,"meta","config");
    store={
      onMeta:cb=>fs.onSnapshot(M,s=>cb(s.exists()?s.data():null),showErr),
      onEntries:cb=>fs.onSnapshot(E,s=>cb(s.docs.map(d=>d.data())),showErr),
      onLogs:cb=>fs.onSnapshot(fs.query(L,fs.orderBy("at","desc"),fs.limit(300)),s=>cb(s.docs.map(d=>d.data())),showErr),
      saveMeta:m=>fs.setDoc(M,m),save:e=>fs.setDoc(fs.doc(E,e.id),e),log:l=>fs.addDoc(L,l)
    };
  }else{
    $("#banner").innerHTML='<div class="banner">Demo mode: data is saved only on this device.</div>';
    const k="hisab_demo_"+KEY;const ld=(n,d)=>{try{return JSON.parse(localStorage.getItem(k+n)||d)}catch{return JSON.parse(d)}};
    let mcb,ecb,lcb;const ev=()=>{mcb&&mcb(ld("m","null"));ecb&&ecb(ld("e","[]"));lcb&&lcb(ld("l","[]").sort((a,b)=>b.at-a.at))};
    store={onMeta:cb=>{mcb=cb;ev()},onEntries:cb=>{ecb=cb;ev()},onLogs:cb=>{lcb=cb;ev()},
      saveMeta:async m=>{lset(k+"m",JSON.stringify(m));ev()},
      save:async e=>{const a=ld("e","[]").filter(x=>x.id!==e.id);a.push(e);lset(k+"e",JSON.stringify(a));ev()},
      log:async l=>{const a=ld("l","[]");a.push(l);lset(k+"l",JSON.stringify(a));ev()}};
  }
}

/* ---------- saved hisabs on this device (for switching) ---------- */
const getList=()=>{try{return JSON.parse(lget("hisab_list")||"[]")}catch{return[]}};
const saveList=(k,n)=>{const l=getList().filter(x=>x.key!==k);l.unshift({key:k,name:n});lset("hisab_list",JSON.stringify(l.slice(0,20)))};
function logout(){if(!confirm("Log out of this hisab? You can open it again from the saved list or your private link."))return;lset("hisab_key","");location.hash="";location.reload()}
function openSaved(k){lset("hisab_key",k);location.hash="k="+k;location.reload()}

/* ---------- state ---------- */
let config=null,entries=[],logs=[],me=lget("hisab_me_"+KEY),gotMeta=false,gotEntries=false;
const members=()=>config?config.members:DEFAULT_MEMBERS;
const nm=id=>(members().find(m=>m.id===id)||{name:id}).name;
const col=id=>PAL[Math.max(0,members().findIndex(m=>m.id===id))%PAL.length];

/* ---------- maths: net[p] > 0 => p is owed money, < 0 => p owes ---------- */
function norm(e){ // upgrade old 2-person entries (payer D/V + dShare)
  if(e.type==="expense"){if(e.shares)return e;const d=e.dShare??.5;return {...e,shares:{D:r2(e.amount*d),V:r2(e.amount*(1-d))}}}
  return e.to?e:{...e,to:e.payer==="D"?"V":"D"};
}
const active=()=>entries.filter(e=>!e.deleted).map(norm).sort((a,b)=>a.date===b.date?a.createdAt-b.createdAt:a.date<b.date?-1:1);
function effect(e){const n={};const add=(i,v)=>n[i]=r2((n[i]||0)+v);
  add(e.payer,e.amount);if(e.type==="expense")for(const[k,v]of Object.entries(e.shares))add(k,-v);else add(e.to,-e.amount);return n}
function settle(net){const c=[],d=[];
  for(const[k,v]of Object.entries(net)){const x=r2(v);if(x>.004)c.push([k,x]);else if(x<-.004)d.push([k,-x])}
  c.sort((a,b)=>b[1]-a[1]);d.sort((a,b)=>b[1]-a[1]);const out=[];let i=0,j=0;
  while(i<c.length&&j<d.length){const a=Math.min(c[i][1],d[j][1]);out.push({from:d[j][0],to:c[i][0],amt:r2(a)});c[i][1]=r2(c[i][1]-a);d[j][1]=r2(d[j][1]-a);if(c[i][1]<.005)i++;if(d[j][1]<.005)j++}
  return out}
const lines=t=>t.length?t.map(x=>`${nm(x.from)} pays ${nm(x.to)} ${inr(x.amt)}`):["All settled ✅"];
function compute(list=active()){
  const net={},paid={},share={},cats={};let total=0;members().forEach(m=>{net[m.id]=0;paid[m.id]=0;share[m.id]=0});
  const rows=list.map(e=>{
    const f=effect(e);for(const[k,v]of Object.entries(f))net[k]=r2((net[k]||0)+v);
    if(e.type==="expense"){paid[e.payer]=(paid[e.payer]||0)+e.amount;total+=e.amount;for(const[k,v]of Object.entries(e.shares))share[k]=(share[k]||0)+v;cats[e.cat]=(cats[e.cat]||0)+e.amount}
    return {e,net:{...net}};
  });
  return {rows,net,paid,share,cats,total,transfers:settle(net)};
}
function netPills(n,two){
  if(two){const t=settle(n);if(!t.length)return `<span class="pill zero">Settled</span>`;const x=t[0];return `<span class="pill ${x.from===members()[0].id?"green":"red"}">${esc(nm(x.from))} → ${esc(nm(x.to))} ${inr(x.amt)}</span>`}
  const p=Object.entries(n).filter(([,v])=>Math.abs(v)>.004);if(!p.length)return `<span class="pill zero">Settled</span>`;
  return `<div class="nets">${p.map(([k,v])=>`<span class="pill sm ${v>0?"green":"red"}">${esc(nm(k))} ${v>0?"+":"−"}${inr(Math.abs(v))}</span>`).join("")}</div>`;
}

/* ---------- render ---------- */
function render(){
  if(!config)return;
  const c=compute(),two=members().length===2;
  $("#hero").className="hero "+(c.transfers.length?"":"zero");
  $("#hero").innerHTML=`<div class="lbl">CURRENT SETTLEMENT</div>${lines(c.transfers).map(l=>`<div class="line" style="color:${c.transfers.length?"var(--ink)":"var(--green)"}">${esc(l)}</div>`).join("")}<div class="sub">${c.rows.length} entries · ${members().length} people</div>`;
  const top=Object.entries(c.paid).sort((a,b)=>b[1]-a[1])[0];
  $("#kpis").innerHTML=`<div class="kpi"><span>TOTAL SPENT</span><b>${inr(c.total)}</b></div><div class="kpi"><span>ENTRIES</span><b>${c.rows.length}</b></div><div class="kpi"><span>TOP PAYER</span><b>${top&&top[1]>0?esc(nm(top[0])):"-"}</b></div>`;
  $("#ledger").innerHTML=c.rows.length?[...c.rows].reverse().map(({e,net})=>{const ci=CATS[e.type==="expense"?e.cat:"Loan"]||CATS.Other;
    const part=e.type==="expense"?Object.keys(e.shares).filter(k=>e.shares[k]>0):[];
    const sub=e.type==="expense"?`${fdate(e.date)} · ${esc(e.cat)} · paid by ${esc(nm(e.payer))}${part.length<members().length||part.length>2?` · split ${part.length}`:""}`:`${fdate(e.date)} · ${e.type==="loan"?"Loan":"Repayment"} · ${esc(nm(e.payer))} → ${esc(nm(e.to))}`;
    return `<div class="entry" data-id="${esc(e.id)}"><div class="ico" style="background:${ci[1]}22">${e.type==="expense"?ci[0]:e.type==="loan"?"🤝":"💸"}</div><div class="mid"><div class="t">${esc(e.desc||"(no note)")}</div><div class="s">${sub}</div></div><div class="r"><div class="amt">${inr(e.amount)}</div>${netPills(net,two)}</div></div>`}).join(""):`<div class="empty">No entries yet.<br>Tap <b>+</b> to add the first one.</div>`;
  saveList(KEY,config.name||"Hisab");
  $("#since").textContent=`${config.name||"Hisab"} · ${members().map(m=>m.name).join(", ")}`;
  $("#meChip").textContent=me&&members().some(m=>m.id===me)?"👤 "+nm(me):"👤 Who?";
  renderDash(c);renderPrint(c);
}
function renderDash(c){
  const cats=Object.entries(c.cats).sort((a,b)=>b[1]-a[1]);const R=60,C=2*Math.PI*R;let off=0,arcs="";
  cats.forEach(([k,v])=>{const len=v/c.total*C;arcs+=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${(CATS[k]||CATS.Other)[1]}" stroke-width="26" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`;off+=len});
  const ppl=[...members()].sort((a,b)=>(c.paid[b.id]||0)-(c.paid[a.id]||0)),mx=Math.max(...ppl.map(m=>c.paid[m.id]||0),1);
  $("#v-dash").innerHTML=`<h2>Spend by category</h2><div class="card donutwrap">${cats.length?`<svg width="160" height="160" viewBox="0 0 160 160">${arcs}<text x="80" y="76" text-anchor="middle" font-size="11" fill="var(--mute)">TOTAL</text><text x="80" y="95" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)">${inr(c.total)}</text></svg><div class="legend">${cats.map(([k,v])=>`<div><span><i style="background:${(CATS[k]||CATS.Other)[1]}"></i>${esc(k)}</span><b>${inr(v)} · ${Math.round(v/c.total*100)}%</b></div>`).join("")}</div>`:`<div class="empty" style="width:100%">No expenses yet</div>`}</div>
  <h2>Who paid the most</h2><div class="card" style="padding:8px 0">${ppl.map((m,i)=>`<div class="bar"><div class="nm"><span>${esc(m.name)}${i===0&&c.paid[m.id]>0?" 🏆":""}</span><b>${inr(c.paid[m.id]||0)}</b></div><div class="tr"><div class="fl" style="width:${(c.paid[m.id]||0)/mx*100}%;background:${col(m.id)}"></div></div></div>`).join("")}</div>
  <h2>Fair share check</h2><div class="card"><table><tr><th>Person</th><th class="n">Paid</th><th class="n">Share</th><th class="n">Net</th></tr>${members().map(m=>{const d=c.net[m.id]||0;return `<tr><td>${esc(m.name)}</td><td class="n">${inr(c.paid[m.id]||0)}</td><td class="n">${inr(c.share[m.id]||0)}</td><td class="n" style="color:var(${d>=0?"--green":"--red"});font-weight:700">${d>=0?"+":"−"}${inr(Math.abs(d))}</td></tr>`}).join("")}</table></div>
  <h2>Category table</h2><div class="card"><table><tr><th>Category</th><th class="n">Total</th><th class="n">%</th></tr>${cats.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n"><b>${inr(v)}</b></td><td class="n">${Math.round(v/c.total*100)}%</td></tr>`).join("")||'<tr><td colspan="3" class="empty">—</td></tr>'}</table></div>`;
}
function renderLogs(){
  $("#v-logs").innerHTML=`<h2>Activity log</h2><div class="card">${logs.length?logs.map(l=>`<div class="log"><b>${esc(l.who)}</b> ${esc(l.action)}: ${esc(l.text)}<small>${new Date(l.at).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</small></div>`).join(""):'<div class="empty">No activity yet</div>'}</div>`;
}
function renderPrint(c){
  const two=members().length===2;
  const bal=n=>{const t=settle(n);return t.length?(two?`${nm(t[0].from)} → ${nm(t[0].to)} ${inr(t[0].amt)}`:Object.entries(n).filter(([,v])=>Math.abs(v)>.004).map(([k,v])=>`${nm(k)} ${v>0?"+":"-"}${inr(Math.abs(v))}`).join(", ")):"Settled"};
  $("#printArea").innerHTML=`<h1>Shared Expense Summary</h1><div>${esc(config.name||"")} · ${members().map(m=>esc(m.name)).join(", ")} · ${new Date().toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"})}</div>
  <h4>Ledger</h4><table><tr><th>Date</th><th>What</th><th>Category</th><th>Paid by</th><th class="n">Amount</th><th>Balance</th></tr>${c.rows.map(({e,net})=>`<tr><td>${fdate(e.date)}</td><td>${esc(e.desc)}</td><td>${e.type==="expense"?esc(e.cat):e.type==="loan"?"Loan":"Repayment"}</td><td>${esc(nm(e.payer))}</td><td class="n">${inr(e.amount)}</td><td>${esc(bal(net))}</td></tr>`).join("")}</table>
  <h4>Totals</h4><table><tr><th>Person</th><th class="n">Paid</th><th class="n">Share</th><th class="n">Net</th></tr>${members().map(m=>`<tr><td>${esc(m.name)}</td><td class="n">${inr(c.paid[m.id]||0)}</td><td class="n">${inr(c.share[m.id]||0)}</td><td class="n">${(c.net[m.id]||0)>=0?"+":"-"}${inr(Math.abs(c.net[m.id]||0))}</td></tr>`).join("")}</table>
  <div class="box">FINAL SETTLEMENT<br>${lines(c.transfers).map(esc).join("<br>")}</div>
  <h4>Spending by category</h4><table><tr><th>Category</th><th class="n">Total</th><th class="n">%</th></tr>${Object.entries(c.cats).sort((a,b)=>b[1]-a[1]).map(([k,x])=>`<tr><td>${esc(k)}</td><td class="n">${inr(x)}</td><td class="n">${Math.round(x/c.total*100)}%</td></tr>`).join("")}</table>`;
}

/* ---------- add / edit sheet ---------- */
let F=null;
const eqVals=(ids,a)=>{const p=Math.round((+a||0)*100),b=Math.floor(p/ids.length),r=p-b*ids.length;return Object.fromEntries(ids.map((k,i)=>[k,(b+(i<r?1:0))/100]))};
function openSheet(e){
  const ids=members().map(m=>m.id);
  if(e){const part=e.type==="expense"?ids.filter(k=>(e.shares[k]||0)>0):[];const eq=eqVals(part,e.amount);
    const isEq=e.type==="expense"&&part.every(k=>Math.abs((e.shares[k]||0)-eq[k])<.011);
    F={...e,amount:String(e.amount),part:new Set(part),mode:isEq?"eq":"ex",vals:{...(e.shares||{})},edit:true}}
  else F={id:"e"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),type:"expense",date:today(),desc:"",cat:"Food",payer:ids.includes(me)?me:ids[0],to:ids.find(k=>k!==(ids.includes(me)?me:ids[0])),amount:"",part:new Set(ids),mode:"eq",vals:{},edit:false};
  drawSheet();$("#sheetBg").classList.add("open");
}
const closeSheet=()=>$("#sheetBg").classList.remove("open");
function calcShares(){
  const a=Math.round((parseFloat(F.amount)||0)*100),ids=members().map(m=>m.id).filter(k=>F.part.has(k));
  if(!ids.length)return{err:"Pick at least one person to split between"};
  if(F.mode==="eq"){const o=eqVals(ids,F.amount);return{shares:o}}
  if(F.mode==="pct"){const p=ids.map(k=>+F.vals[k]||0),t=p.reduce((x,y)=>x+y,0);if(Math.abs(t-100)>.01)return{err:`Percentages add up to ${r2(t)}%, need 100%`};
    const q=p.map(x=>Math.floor(a*x/100));let rem=a-q.reduce((x,y)=>x+y,0);for(let i=0;rem>0;i=(i+1)%ids.length){q[i]++;rem--}return{shares:Object.fromEntries(ids.map((k,i)=>[k,q[i]/100]))}}
  const v=ids.map(k=>Math.round((+F.vals[k]||0)*100)),t=v.reduce((x,y)=>x+y,0);
  if(t!==a)return{err:`Amounts add up to ${inr(t/100)}, need ${inr(a/100)}`};return{shares:Object.fromEntries(ids.map((k,i)=>[k,v[i]/100]))};
}
function curEntry(){
  const amt=r2(parseFloat(F.amount)||0),b={id:F.id,type:F.type,date:F.date,desc:F.desc.trim(),payer:F.payer,amount:amt,createdBy:F.createdBy||me,createdAt:F.createdAt||Date.now(),updatedAt:Date.now(),deleted:false};
  if(F.type==="expense"){const r=calcShares();return {...b,cat:F.cat,shares:r.shares||{},err:r.err}}
  return {...b,cat:"Loan",to:F.to,err:F.to===F.payer?"Pick two different people":""};
}
function previewHTML(){
  const e=curEntry();if(!e.amount)return `<div class="preview zero">Enter an amount to see the calculation.</div>`;
  if(e.err)return `<div class="preview red">${esc(e.err)}</div>`;
  const others=active().filter(x=>x.id!==e.id),after=settle(compute([...others,e]).net);
  const l=e.type==="expense"?`<b>Shares:</b> ${Object.entries(e.shares).map(([k,v])=>`${esc(nm(k))} ${inr(v)}`).join(" · ")}`:`${esc(nm(e.payer))} → ${esc(nm(e.to))}: <b>${inr(e.amount)}</b>`;
  return `<div class="preview ${after.length?"red":"green"}">${l}<br><b>After this entry:</b><br>${lines(after).map(esc).join("<br>")}</div>`;
}
const chipRow=(id,sel,multi)=>`<div class="cats" id="${id}">${members().map(m=>`<button data-v="${esc(m.id)}" class="${(multi?F.part.has(m.id):sel===m.id)?"on":""}">${esc(m.name)}</button>`).join("")}</div>`;
function drawSheet(){
  const exp=F.type==="expense",ids=members().map(m=>m.id).filter(k=>F.part.has(k));
  $("#sheet").innerHTML=`<h3>${F.edit?"Edit entry":"Add entry"}</h3>
  <div class="seg" id="s-type">${[["expense","Expense"],["loan","Loan"],["repay","Repayment"]].map(([k,t])=>`<button data-v="${k}" class="${F.type===k?"on":""}">${t}</button>`).join("")}</div>
  <label class="f">Amount (₹)</label><input class="amount" id="f-amt" type="number" inputmode="decimal" min="0" step="any" placeholder="0" value="${esc(F.amount)}">
  <label class="f">What for</label><input type="text" id="f-desc" placeholder="e.g. Paneer, Petrol, Dinner" value="${esc(F.desc)}">
  <label class="f">${exp?"Paid by":F.type==="loan"?"Given by":"Paid back by"}</label>${chipRow("s-payer",F.payer)}
  ${exp?`<label class="f">Category</label><div class="cats" id="s-cat">${Object.keys(CATS).filter(k=>k!=="Loan").map(k=>`<button data-v="${k}" class="${F.cat===k?"on":""}">${CATS[k][0]} ${k}</button>`).join("")}</div>
  <label class="f">Split between (tap to include or exclude)</label>${chipRow("s-part",null,true)}
  <label class="f">How to split</label><div class="seg" id="s-mode">${[["eq","Equal"],["pct","Custom %"],["ex","Exact ₹"]].map(([k,t])=>`<button data-v="${k}" class="${F.mode===k?"on":""}">${t}</button>`).join("")}</div>
  ${F.mode!=="eq"?ids.map(k=>`<div class="shr"><span>${esc(nm(k))}</span><input type="number" inputmode="decimal" step="any" data-k="${esc(k)}" value="${esc(F.vals[k]??"")}" placeholder="${F.mode==="pct"?"%":"₹"}"></div>`).join(""):""}`
  :`<label class="f">Paid to / received by</label>${chipRow("s-to",F.to)}`}
  <label class="f">Date</label><input type="date" id="f-date" value="${esc(F.date)}">
  <div id="prev">${previewHTML()}</div>
  <div class="row">${F.edit?`<button class="btn danger" id="f-del">🗑</button>`:""}<button class="btn ghost" id="f-cancel">Cancel</button><button class="btn" id="f-save">Save</button></div>`;
  const rp=()=>$("#prev").innerHTML=previewHTML();
  $("#f-amt").oninput=e=>{F.amount=e.target.value;rp()};
  $("#f-desc").oninput=e=>{F.desc=e.target.value};
  $("#f-date").onchange=e=>{F.date=e.target.value;rp()};
  document.querySelectorAll(".shr input").forEach(i=>i.oninput=e=>{F.vals[e.target.dataset.k]=e.target.value;rp()});
  const seg=(id,fn)=>{const el=$(id);el&&el.querySelectorAll("button").forEach(b=>b.onclick=()=>{fn(b.dataset.v);drawSheet()})};
  seg("#s-type",v=>{F.type=v;if(F.to===F.payer)F.to=members().map(m=>m.id).find(k=>k!==F.payer)});
  seg("#s-payer",v=>{F.payer=v;if(F.to===v)F.to=members().map(m=>m.id).find(k=>k!==v)});
  seg("#s-to",v=>F.to=v);seg("#s-cat",v=>F.cat=v);
  seg("#s-part",v=>{F.part.has(v)?(F.part.size>1&&F.part.delete(v)):F.part.add(v);fillVals()});
  seg("#s-mode",v=>{F.mode=v;fillVals()});
  $("#f-cancel").onclick=closeSheet;$("#f-save").onclick=saveEntry;
  const del=$("#f-del");if(del)del.onclick=deleteEntry;
}
function fillVals(){ // prefill custom boxes with an equal split
  const ids=members().map(m=>m.id).filter(k=>F.part.has(k));
  if(F.mode==="pct"){const b=Math.floor(10000/ids.length)/100;F.vals=Object.fromEntries(ids.map((k,i)=>[k,i===0?r2(100-b*(ids.length-1)):b]))}
  else if(F.mode==="ex")F.vals=eqVals(ids,F.amount);
}
const sumText=e=>e.type==="expense"?`${e.desc||"(no note)"} ${inr(e.amount)} paid by ${nm(e.payer)}, split ${Object.keys(e.shares).filter(k=>e.shares[k]>0).map(nm).join("/")}`:`${e.type==="loan"?"Loan":"Repayment"}: ${e.desc||""} ${inr(e.amount)} ${nm(e.payer)} → ${nm(e.to)}`;
async function saveEntry(){
  const e=curEntry();
  if(!me||!members().some(m=>m.id===me)){toast("Pick who you are first");openMe();return}
  if(!e.amount||e.amount<=0){toast("Enter an amount");return}
  if(!e.date){toast("Pick a date");return}
  if(e.err){toast(e.err);return}
  delete e.err;
  try{await store.save(e);await store.log({who:nm(me),action:F.edit?"edited":"added",text:sumText(e),at:Date.now(),entryId:e.id});closeSheet();toast(F.edit?"Entry updated":"Entry added")}catch(err){showErr(err)}
}
async function deleteEntry(){
  if(!confirm("Delete this entry? It stays in the log."))return;
  const e={...curEntry(),deleted:true};delete e.err;
  try{await store.save(e);await store.log({who:nm(me),action:"deleted",text:sumText(e),at:Date.now(),entryId:e.id});closeSheet();toast("Entry deleted")}catch(err){showErr(err)}
}

/* ---------- group settings ---------- */
function openSettings(){
  const ms=members().map(m=>({...m}));let name=config.name||"";
  const draw=()=>{$("#sheet").innerHTML=`<h3>Group settings</h3><label class="f">Group name</label><input type="text" id="g-name" value="${esc(name)}">
  <label class="f">People (rename anyone, or add more)</label>${ms.map((m,i)=>`<div class="shr"><span style="flex:0 0 22px;color:var(--mute)">${i+1}</span><input type="text" data-i="${i}" value="${esc(m.name)}" style="width:100%!important"></div>`).join("")}
  ${ms.length<10?`<div class="row"><button class="btn ghost" id="g-add">+ Add person</button></div>`:""}
  <div class="row"><button class="btn ghost" id="g-cancel">Cancel</button><button class="btn" id="g-save">Save</button></div>
  <div class="row"><button class="btn danger" id="g-out" style="flex:1">Switch hisab / Log out</button></div>
  <p style="color:var(--mute);font-size:12px">People can be renamed or added, but not removed once they have entries.</p>`;
    $("#g-name").oninput=e=>name=e.target.value;
    document.querySelectorAll("[data-i]").forEach(i=>i.oninput=e=>ms[+e.target.dataset.i].name=e.target.value);
    $("#g-cancel").onclick=closeSheet;$("#g-out").onclick=logout;
    const add=$("#g-add");if(add)add.onclick=()=>{ms.push({id:"m"+Date.now().toString(36),name:"Person "+(ms.length+1)});draw()};
    $("#g-save").onclick=async()=>{if(ms.some(m=>!m.name.trim()))return toast("Every person needs a name");
      if(new Set(ms.map(m=>m.name.trim().toLowerCase())).size!==ms.length)return toast("Names must be different");
      try{await store.saveMeta({name:name.trim()||"Our Hisab",members:ms.map(m=>({id:m.id,name:m.name.trim()})),createdAt:config.createdAt||Date.now()});
        await store.log({who:nm(me)||"Someone",action:"updated",text:"group settings",at:Date.now()});closeSheet();toast("Saved")}catch(e){showErr(e)}}};
  draw();$("#sheetBg").classList.add("open");
}

/* ---------- setup (new hisab) ---------- */
function showSetup(){
  $("#welcome").style.display="none";$("#main").style.display="none";$("#setup").style.display="block";
  const sel=$("#su-n");if(!sel.options.length){for(let i=2;i<=10;i++)sel.add(new Option(i+" people",i));}
  const drawN=()=>{const n=+sel.value,old=[...document.querySelectorAll("#su-names input")].map(i=>i.value);
    $("#su-names").innerHTML=Array.from({length:n},(_,i)=>`<label class="f">Person ${i+1}</label><input type="text" value="${esc(old[i]||"")}" placeholder="Name ${i+1}">`).join("")};
  sel.onchange=drawN;drawN();
  $("#su-go").onclick=async()=>{const names=[...document.querySelectorAll("#su-names input")].map(i=>i.value.trim());
    if(names.some(n=>!n))return toast("Enter every name");if(new Set(names.map(n=>n.toLowerCase())).size!==names.length)return toast("Names must be different");
    await store.saveMeta({name:$("#su-name").value.trim()||"Our Hisab",members:names.map((n,i)=>({id:"m"+(i+1),name:n})),createdAt:Date.now()});
    $("#setup").style.display="none";$("#main").style.display="block"};
}

/* ---------- wiring ---------- */
function openMe(){
  $("#meList").innerHTML=members().map(m=>`<button class="btn" data-me="${esc(m.id)}" style="min-width:45%">I'm ${esc(m.name)}</button>`).join("");
  document.querySelectorAll("[data-me]").forEach(b=>b.onclick=()=>{me=b.dataset.me;lset("hisab_me_"+KEY,me);$("#meBg").classList.remove("open");render()});
  $("#meBg").classList.add("open");
}
function showView(v){document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on",x.id==="v-"+v));document.querySelectorAll("nav .tab[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===v));$("#hero").style.display=v==="home"?"":"none";scrollTo(0,0)}
let wired=false;
function decide(){
  if(!gotMeta||!gotEntries)return;
  if(!config){
    if(entries.length){config={name:"Devesh & Vishal",members:DEFAULT_MEMBERS,createdAt:Date.now()};store.saveMeta(config).catch(showErr)}
    else{showSetup();return}
  }
  $("#setup").style.display="none";$("#main").style.display="block";
  if(!wired){wired=true;wire()}
  if(!me||!members().some(m=>m.id===me))openMe();
  render();
}
function wire(){
  document.querySelectorAll("nav .tab[data-v]").forEach(b=>b.onclick=()=>showView(b.dataset.v));
  $("#settleTab").onclick=()=>{showView("home");toast(lines(compute().transfers).join(" · "))};
  $("#fab").onclick=()=>openSheet();
  $("#meChip").onclick=openMe;$("#cfgBtn").onclick=openSettings;
  $("#ledger").onclick=ev=>{const el=ev.target.closest(".entry");if(!el)return;const e=entries.map(norm).find(x=>x.id===el.dataset.id);if(e)openSheet(e)};
  $("#sheetBg").onclick=ev=>{if(ev.target.id==="sheetBg")closeSheet()};
  $("#shareBtn").onclick=async()=>{const u=location.href;try{if(navigator.share){await navigator.share({title:"Hisab",url:u})}else{await navigator.clipboard.writeText(u);toast("Private link copied")}}catch{try{await navigator.clipboard.writeText(u);toast("Private link copied")}catch{prompt("Copy this private link:",u)}}};
  $("#pdfBtn").onclick=()=>{render();print()};
}
async function start(){
  $("#welcome").style.display="none";
  await initStore();
  store.onMeta(m=>{config=m;gotMeta=true;decide();if(config&&wired)render()});
  store.onEntries(a=>{entries=a;gotEntries=true;decide();if(config&&wired)render()});
  store.onLogs(a=>{logs=a;renderLogs()});
}
if(KEY){start()}else{
  $("#welcome").style.display="block";
  const sv=getList();if(sv.length)$("#saved").innerHTML='<h2 style="text-align:left">Your hisabs</h2>'+sv.map(x=>`<button class="btn ghost" data-k="${esc(x.key)}" style="width:100%;margin-bottom:6px;text-align:left">📒 ${esc(x.name)}</button>`).join("");
  document.querySelectorAll("#saved [data-k]").forEach(b=>b.onclick=()=>openSaved(b.dataset.k));
  $("#createBtn").onclick=()=>{setKey(newKey());KEY=getKey();start()};
  $("#openBtn").onclick=()=>{const m=$("#pasteLink").value.match(/k=([A-Za-z0-9_-]{24,})/);if(!m)return toast("That link has no key");setKey(m[1]);KEY=m[1];start()};
}
addEventListener("hashchange",()=>{const k=getKey();if(k&&k!==KEY)location.reload()});
</script>
